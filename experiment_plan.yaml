# CrossTalk adapted this configuration from the Template code-project exemplar.
conditions:
  - name: native_text_baseline
    role: reference
    description: "Observed native PDF text with all layout and quality flags retained."
  - name: wrapper_excluded_native
    role: variant
    description: "Native text after excluding source wrappers."
  - name: native_rich
    role: variant
    description: "The native-rich comparison cohort with its own eligible issue counts."
  - name: targeted_ocr
    role: variant
    description: "The cohort with targeted OCR inputs and its own eligible issue counts."
  - name: reviewed_article_corpus
    role: proposed
    description: "Planned manually validated article and region corpus."
metrics:
  primary:
    name: reviewed_page_coverage
    direction: maximize
protocol: "Reconcile holdings before inference. Compare the observed views with issue-level resampling within each eligible cohort. Direct article reach and exact attested issue counts have separate denominators."
expected_figures: [fig:native-sensitivity-and-ocr-contrasts, fig:ga04_evidencematrix]
expected_tables: []
baselines: [native_text_baseline]
ablations: [wrapper_excluded_native, native_rich, targeted_ocr]
