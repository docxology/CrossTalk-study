# CrossTalk adapted this configuration from the Template code-project exemplar.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crosstalk-research"
version = "0.5.0"
description = "Provenance-aware longitudinal linguistic and visual research on CrossTalk"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx2[http2,brotli,zstd]>=2.0",
  "pydantic>=2.10",
  "pymupdf>=1.25,<2",
  "pillow>=11",
  "typer>=0.16",
  "rich>=14",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.14", "basedpyright>=1.31"]

[project.scripts]
crosstalk = "crosstalk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/crosstalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
source = ["src/crosstalk"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# Typed domain errors deliberately carry contextual reason strings.
# Numeric thresholds in this descriptive pipeline are explicit method constants.
# Explicit concatenation is required by basedpyright's implicit-concatenation check.
ignore = ["COM812", "D203", "D213", "ISC001", "ISC003", "CPY001", "TD002", "TD003", "FIX002", "TRY003", "EM101", "EM102", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "SLF001", "ARG001"]
"scripts/**" = ["INP001"]
"src/crosstalk/report.py" = ["E501"]
"src/crosstalk/catalog_report.py" = ["E501"]
"src/crosstalk/corpus_report.py" = ["E501"]
# getattr lets the Pydantic adapter parse upstream partially typed PDF returns.
"src/crosstalk/pdf_adapter.py" = ["B009"]
# Native PDF boundaries are parsed through Pydantic rather than incomplete upstream stubs.
"src/crosstalk/ocr_engine.py" = ["B009"]
"src/crosstalk/ocr_source.py" = ["B009"]
"tests/ocr/conftest.py" = ["B009"]
"tests/ocr/test_ocr_geometry.py" = ["B009"]
# The isolated entry point explicitly installs its selected read-only import roots.
"scripts/ocr_compute.py" = ["INP001", "E402", "T201"]
"scripts/page_appearance_compute.py" = ["INP001", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
include = ["src"]
reportUnusedCallResult = "warning"

[tool.template]
source_exemplar = "templates/template_code_project"
platform_version = "4.0.2"
